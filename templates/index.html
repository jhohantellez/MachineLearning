<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ML Salary Predictor</title>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', sans-serif;
            background: #0f1117;
            color: #e2e8f0;
            min-height: 100vh;
        }

        nav {
            background: #1a1d2e;
            border-bottom: 1px solid #2d3148;
            padding: 0 2rem;
            position: sticky;
            top: 0;
        }

        .nav-inner {
            max-width: 1100px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 60px;
        }

        .nav-brand {
            color: #7c83f5;
            font-weight: bold;
            text-decoration: none;
        }

        .nav-links {
            display: flex;
            gap: 10px;
            list-style: none;
        }

        .nav-links a {
            color: #a0aec0;
            text-decoration: none;
            padding: 5px 10px;
        }

        .nav-links a:hover {
            background: #2d3148;
            color: white;
        }

        
        .dropdown { position: relative; }

        .dropdown-menu {
            display: none;
            position: absolute;
            background: #1a1d2e;
            border: 1px solid #2d3148;
            margin-top: 5px;
        }

        .dropdown:hover .dropdown-menu {
            display: block;
        }

        .dropdown-menu a {
            display: block;
            padding: 8px;
        }

       
        .sub-dropdown { position: relative; }

        .sub-dropdown-menu {
            display: none;
            position: absolute;
            left: 100%;
            top: 0;
            background: #1a1d2e;
            border: 1px solid #2d3148;
        }

        .sub-dropdown:hover .sub-dropdown-menu {
            display: block;
        }

        .page {
            padding: 40px;
            max-width: 1100px;
            margin: auto;
        }

        .title {
            font-size: 28px;
            color: #7c83f5;
        }

        .box {
            margin-top: 20px;
            padding: 40px;
            border: 1px dashed #2d3148;
            text-align: center;
            color: #555;
        }
    </style>
</head>

<body>

<nav>
    <div class="nav-inner">
        <a class="nav-brand" href="#">⚡ ML Salary Predictor</a>

        <ul class="nav-links">
            <li><a href="#">Home</a></li>

            <li class="dropdown">
                <a href="#">Supervised ML</a>
                <div class="dropdown-menu">
                    <div class="sub-dropdown">
                        <a href="#">Linear Regression</a>
                        <div class="sub-dropdown-menu">
                            <a href="/linearregression/concepts">Concepts</a>
                            <a href="/linearregression/application">Application</a>
                        </div>
                    </div>
                </div>
            </li>
        </ul>
    </div>
</nav>

<div class="page">
    <h1 class="title">Welcome</h1>
    <p>reparairing</p>

    <div class="box">
        reparairing
    </div>
</div>

</body>
</html>
