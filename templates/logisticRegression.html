<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Predicción Logística</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-5">
    <div class="card p-4 shadow">
        <h2 class="mb-4">Calculadora de Probabilidad de Compra</h2>
        <form method="POST">
            <div class="row g-3">
                <div class="col-md-6">
                    <label>Edad:</label>
                    <input type="number" name="edad" class="form-control" required>
                </div>
                <div class="col-md-6">
                    <label>Ingreso Mensual:</label>
                    <input type="number" name="ingreso_mensual" class="form-control" required>
                </div>
                <div class="col-md-6">
                    <label>Visitas Web al Mes:</label>
                    <input type="number" name="visitas_web_mes" class="form-control" required>
                </div>
                <div class="col-md-6">
                    <label>Tiempo en Sitio (min):</label>
                    <input type="number" step="0.1" name="tiempo_sitio_min" class="form-control" required>
                </div>
                <div class="col-md-6">
                    <label>Compras Previas:</label>
                    <input type="number" name="compras_previas" class="form-control" required>
                </div>
                <div class="col-md-6">
                    <label>¿Usó Descuento? (0=No, 1=Sí):</label>
                    <input type="number" min="0" max="1" name="descuento_usado" class="form-control" required>
                </div>
            </div>
            <button type="submit" class="btn btn-primary w-100 mt-4">Analizar Cliente</button>
        </form>

        {% if prediction_text %}
        <div class="alert alert-success mt-4">     
            <h4>Resultado: {{ prediction_text }}</h4>
        </div>
        {% endif %}
    </div>
</body>
</html>
