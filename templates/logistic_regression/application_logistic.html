<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Loan Approval Prediction</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">

    <div class="card shadow p-4">
        <h1 class="text-center mb-4">Loan Approval Prediction</h1>

        <p class="text-center text-muted">
            Enter the following information to predict whether a loan will be approved.
        </p>

        <!-- FORM -->
        <form method="POST">

            <!-- Age -->
            <div class="mb-3">
                <label class="form-label">Age:</label>
                <input type="number" name="Age" class="form-control" required>
            </div>

            <!-- Income -->
            <div class="mb-3">
                <label class="form-label">Income:</label>
                <input type="number" step="any" name="Income" class="form-control" required>
            </div>

            <!-- Credit Score -->
            <div class="mb-3">
                <label class="form-label">Credit Score:</label>
                <input type="number" name="Credit_Score" class="form-control" required>
            </div>

            <!-- Loan Amount -->
            <div class="mb-3">
                <label class="form-label">Loan Amount:</label>
                <input type="number" step="any" name="Loan_Amount" class="form-control" required>
            </div>

            <!-- Loan Term -->
            <div class="mb-3">
                <label class="form-label">Loan Term (months):</label>
                <input type="number" name="Loan_Term" class="form-control" required>
            </div>

            <!-- Employment Status -->
            <div class="mb-3">
                <label class="form-label">Employment Status:</label>
                <select name="Employment_Status" class="form-select" required>
                    <option value="">Select...</option>
                    <option value="Employed">Employed</option>
                    <option value="Unemployed">Unemployed</option>
                    <option value="Self-employed">Self-employed</option>
                </select>
            </div>

            <!-- Button -->
            <button class="btn btn-primary w-100">Predict Loan Approval</button>
        </form>

        <!-- RESULT -->
        {% if prediction is not none %}
        <div class="alert mt-4 text-center 
            {% if "Approved" in prediction %}alert-success{% else %}alert-danger{% endif %}">
            
            <h4>Prediction:</h4>
            <strong>{{ prediction }}</strong><br>
            <small>Probability: {{ probability }}</small>
        </div>
        {% endif %}

    </div>

</div>

</body>
</html>
