<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Linear Regression Prediction</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/pages.css">
</head>
<body class="bg-light">

<div class="container mt-5">

    <div class="card shadow p-4">
        <h1 class="text-center mb-4"> Salary Prediction</h1>

        <p class="text-center text-muted">
            Enter the following values to predict the estimated salary using a Linear Regression model.
        </p>

        <!-- FORM -->
        <form method="POST">

            <!-- Experience -->
            <div class="mb-3">
                <label class="form-label">Years of Experience:</label>
                <input type="number" step="any" name="experience" class="form-control" required>
            </div>

            <!-- Skills -->
            <div class="mb-3">
                <label class="form-label">Number of Skills:</label>
                <input type="number" step="any" name="skills" class="form-control" required>
            </div>

            <!-- Certifications -->
            <div class="mb-3">
                <label class="form-label">Number of Certifications:</label>
                <input type="number" step="any" name="certifications" class="form-control" required>
            </div>

            <!-- Button -->
            <button class="btn btn-primary w-100">Predict Salary</button>
        </form>

        <!-- RESULT -->
        {% if prediction is not none %}
        <div class="alert alert-success mt-4 text-center">
            <h4>Predicted Salary:</h4>
            <strong>${{ prediction }}</strong>
        </div>
        {% endif %}

    </div>

</div>

</body>
</html>
